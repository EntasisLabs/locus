[package]
name = "locus-surreal-adapter"
version = "0.1.0"
edition = "2024"
description = "SurrealDB runtime client adapter for Locus hosts and WASM consumers"
license = "Apache-2.0"

[features]
default = ["native"]
native = [
    "surrealdb/protocol-http",
    "surrealdb/kv-surrealkv",
    "surrealdb/rustls",
    "surrealdb/kv-mem",
    "dep:tracing",
]
wasm = ["surrealdb/kv-indxdb", "surrealdb/kv-mem"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
locus-core-rs = { version = "0.4.2", path = "../locus-core-rs" }
serde_json = "1"
surrealdb = { version = "3", default-features = false, features = ["protocol-ws"] }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
