[package]
name = "locus-core-rs"
version = "0.4.2"
edition = "2024"
description = "Core STTP parsing, validation, storage contracts, and application services for Rust"
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/locus-core-rs"
keywords = ["sttp", "context", "memory", "mcp", "surrealdb"]
categories = ["parser-implementations", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
surreal-runtime = []

[[test]]
name = "surrealdb_runtime_tests"
path = "tests/surrealdb_runtime_tests.rs"
required-features = ["surreal-runtime"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4", "js"] }
