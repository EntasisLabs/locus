[package]
name = "locus-mcp"
version = "0.3.1"
edition = "2024"

[features]
default = []
local-embedding = ["locus-sdk/local-embedding"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
rmcp = { version = "1.6.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
locus-core-rs = { version = "0.5.1", path = "../locus-core-rs", features = ["surreal-runtime"] }
locus-surreal-adapter = { version = "0.1.1", path = "../locus-surreal-adapter" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
locus-sdk = { version = "0.3.1", path = "../locus-sdk" }
