[package]
name = "locus-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for Locus STTP parsing and in-browser memory workflows"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["memory"]
memory = []
surreal = ["dep:locus-surreal-adapter"]

[dependencies]
anyhow = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
locus-core-rs = { version = "0.5.0", path = "../locus-core-rs" }
locus-sdk = { version = "0.3.0", path = "../locus-sdk", default-features = false }
locus-surreal-adapter = { path = "../locus-surreal-adapter", default-features = false, features = ["wasm"], optional = true }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
